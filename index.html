<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="방문자와 소통하는 온라인 방명록">
  <title>My Guestbook | 방명록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <span class="eyebrow">A LITTLE SPACE TO CONNECT</span>
      <h1>방명록</h1>
      <p>방문해 주셔서 감사합니다.<br>따뜻한 한마디를 남겨 주세요 :)</p>
    </header>

    <section class="write-card" aria-labelledby="write-title">
      <h2 id="write-title">메시지 남기기</h2>
      <form id="guestbook-form">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" maxlength="30"
               placeholder="이름 또는 닉네임" required>
        <div class="message-heading">
          <label for="message">메시지</label>
          <span id="char-count">0 / 300</span>
        </div>
        <textarea id="message" name="message" maxlength="300" rows="4"
                  placeholder="방명록을 작성해 주세요." required></textarea>
        <button id="submit-button" type="submit">방명록 등록하기 <span>→</span></button>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="entries-section" aria-labelledby="entries-title">
      <div class="entries-heading">
        <div>
          <span class="eyebrow">GUEST MESSAGES</span>
          <h2 id="entries-title">방문자 메시지</h2>
        </div>
        <button id="refresh-button" class="refresh-button" type="button">새로고침 ↻</button>
      </div>
      <p id="list-status" class="list-status" aria-live="polite">방명록을 불러오는 중입니다.</p>
      <div id="entries" class="entries"></div>
      <p class="privacy-note">작성한 메시지는 공개되므로 개인정보를 입력하지 마세요.</p>
    </section>

    <footer>Made with GitHub Pages & Google Apps Script</footer>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
